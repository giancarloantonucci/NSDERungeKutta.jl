name: Documenter
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

permissions:
  contents: write       # deploydocs pushes to gh-pages
  actions: write        # julia-actions/cache deletes its own stale caches
  statuses: write       # preview status on PRs
  pull-requests: read

jobs:
  build:
    name: Documenter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          show-versioninfo: true
      - uses: julia-actions/cache@v3

      # Develop this checkout into the docs environment. Dependencies resolve
      # from General under the package compatibility bounds.
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()

      - name: Build and deploy documentation
        env:
          JULIA_NUM_THREADS: 4
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --color=yes --project=docs docs/make.jl
