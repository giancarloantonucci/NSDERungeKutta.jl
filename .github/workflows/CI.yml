name: CI
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: write        # julia-actions/cache deletes its own stale caches

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The declared minimum (Project.toml `julia = "1.6"`, verified 1.6–1.13)
        # spelled out so it does not move with the LTS label, plus current stable.
        version: ['1.6', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        # macos-latest is Apple Silicon and Julia 1.6 ships Intel-only macOS
        # binaries: swap in the Intel runner for the minimum version.
        exclude:
          - version: '1.6'
            os: macos-latest
        include:
          - version: '1.6'
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # Every dependency, including the NSDE packages, resolves from General:
      # the stock build/test actions are all that is needed.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
