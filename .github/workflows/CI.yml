name: CI
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: write        # julia-actions/cache deletes its own stale caches

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Supported minimum and latest stable Julia.
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3

      # A throw-away environment with the package dev-ed into it; Pkg.test
      # builds the sandbox from [deps], the test extras and [compat], with
      # --check-bounds=yes.
      - name: Test
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(temp=true)
          Pkg.develop(path=pwd())
          Pkg.test("NSDERungeKutta"; coverage=true)

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: Check Julia formatting
        run: julia -e 'using Pkg; Pkg.activate(mktempdir()); Pkg.add(PackageSpec(name="JuliaFormatter", version="2.14.0")); using JuliaFormatter; @assert format("."; overwrite=false)'
