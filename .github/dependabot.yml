# NSDERungeKutta is registered in General, so Dependabot covers both the GitHub
# Actions versions and the Julia [compat] bounds.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: julia
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: LinearAlgebra
      - dependency-name: Printf
      - dependency-name: SparseArrays
      - dependency-name: Test
